<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>總覽</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 16px; font-size: 24px; }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .stat {
      flex: 1; min-width: 140px; padding: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--color-primary); }
    .stat-label { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
    button {
      padding: 8px 16px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: var(--color-primary-hover); }
  </style>
</head>
<body>
  <h1 id="page-title"></h1>
  <div class="stat-row">
    <div class="stat"><div class="stat-value">42</div><div class="stat-label" id="label-users"></div></div>
    <div class="stat"><div class="stat-value">128</div><div class="stat-label" id="label-orders"></div></div>
    <div class="stat"><div class="stat-value">96%</div><div class="stat-label" id="label-satisfaction"></div></div>
  </div>
  <div class="card">
    <h2 id="section-quick-actions"></h2>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button id="btn-goto-profile"></button>
      <button id="btn-update-badge"></button>
      <button id="btn-set-title"></button>
    </div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/iframe-client.js"></script>
  <script>
    var T = {
      'zh-TW': {
        title: '總覽',
        users: '使用者',
        orders: '訂單',
        satisfaction: '滿意度',
        quickActions: '快速操作',
        btnProfile: '前往個人設定',
        btnBadge: '更新儀表板徽章',
        btnTitle: '設定標題'
      },
      'en': {
        title: 'Overview',
        users: 'Users',
        orders: 'Orders',
        satisfaction: 'Satisfaction',
        quickActions: 'Quick Actions',
        btnProfile: 'Go to Profile',
        btnBadge: 'Update Dashboard Badge',
        btnTitle: 'Set Title'
      }
    };

    function renderPage() {
      var lang = I18n.currentLang;
      var t = T[lang] || T['zh-TW'];
      document.getElementById('page-title').textContent = t.title;
      document.title = t.title;
      document.getElementById('label-users').textContent = t.users;
      document.getElementById('label-orders').textContent = t.orders;
      document.getElementById('label-satisfaction').textContent = t.satisfaction;
      document.getElementById('section-quick-actions').textContent = t.quickActions;
      document.getElementById('btn-goto-profile').textContent = t.btnProfile;
      document.getElementById('btn-update-badge').textContent = t.btnBadge;
      document.getElementById('btn-set-title').textContent = t.btnTitle;
    }

    I18n.init(localStorage.getItem('menu-lang') || 'zh-TW');
    renderPage();

    MenuAPI.onLanguageChange(function(lang) {
      I18n.switchTo(lang);
      renderPage();
    });

    document.getElementById('btn-goto-profile').addEventListener('click', function() {
      MenuAPI.navigate('profile');
    });
    document.getElementById('btn-update-badge').addEventListener('click', function() {
      MenuAPI.updateBadge('dashboard', 5);
    });
    document.getElementById('btn-set-title').addEventListener('click', function() {
      MenuAPI.setTitle(T[I18n.currentLang].title);
    });
  </script>
</body>
</html>
