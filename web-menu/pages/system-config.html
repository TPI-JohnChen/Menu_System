<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>系統設定</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 16px; font-size: 24px; }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--color-border);
    }
    .toggle-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1 id="page-title"></h1>
  <div class="card">
    <div class="toggle-row">
      <span id="toggle-backup"></span>
      <input type="checkbox" checked>
    </div>
    <div class="toggle-row">
      <span id="toggle-logging"></span>
      <input type="checkbox" checked>
    </div>
    <div class="toggle-row">
      <span id="toggle-maintenance"></span>
      <input type="checkbox">
    </div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/iframe-client.js"></script>
  <script>
    var T = {
      'zh-TW': {
        title: '系統設定',
        backup: '啟用自動備份',
        logging: '啟用日誌記錄',
        maintenance: '維護模式'
      },
      'en': {
        title: 'System Settings',
        backup: 'Enable Auto Backup',
        logging: 'Enable Logging',
        maintenance: 'Maintenance Mode'
      }
    };

    function renderPage() {
      var lang = I18n.currentLang;
      var t = T[lang] || T['zh-TW'];
      document.getElementById('page-title').textContent = t.title;
      document.title = t.title;
      document.getElementById('toggle-backup').textContent = t.backup;
      document.getElementById('toggle-logging').textContent = t.logging;
      document.getElementById('toggle-maintenance').textContent = t.maintenance;
    }

    I18n.init(localStorage.getItem('menu-lang') || 'zh-TW');
    renderPage();

    MenuAPI.onLanguageChange(function(lang) {
      I18n.switchTo(lang);
      renderPage();
    });
  </script>
</body>
</html>
