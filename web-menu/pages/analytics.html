<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>分析</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 16px; font-size: 24px; }
    .chart-placeholder {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      color: var(--color-text-secondary);
      margin-bottom: 16px;
    }
    .chart-placeholder .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1 id="page-title"></h1>
  <div class="chart-placeholder">
    <span class="big-icon">📈</span>
    <span id="placeholder-1"></span>
  </div>
  <div class="chart-placeholder">
    <span class="big-icon">📊</span>
    <span id="placeholder-2"></span>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/iframe-client.js"></script>
  <script>
    var T = {
      'zh-TW': {
        title: '分析報表',
        placeholder1: '此處將顯示圖表與分析資料',
        placeholder2: '此處將顯示趨勢圖'
      },
      'en': {
        title: 'Analytics',
        placeholder1: 'Charts and analytics data will be displayed here',
        placeholder2: 'Trend charts will be displayed here'
      }
    };

    function renderPage() {
      var lang = I18n.currentLang;
      var t = T[lang] || T['zh-TW'];
      document.getElementById('page-title').textContent = t.title;
      document.title = t.title;
      document.getElementById('placeholder-1').textContent = t.placeholder1;
      document.getElementById('placeholder-2').textContent = t.placeholder2;
    }

    I18n.init(localStorage.getItem('menu-lang') || 'zh-TW');
    renderPage();

    MenuAPI.onLanguageChange(function(lang) {
      I18n.switchTo(lang);
      renderPage();
    });
  </script>
</body>
</html>
