<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Menu System 系統架構</title>
  <desc id="desc">呈現使用者瀏覽器、AI Proxy 與六種 AI Providers 之間的元件與資料流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2235"/>
      <stop offset="1" stop-color="#102b3f"/>
    </linearGradient>
    <linearGradient id="browserPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d42"/>
      <stop offset="1" stop-color="#0b2234"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020914" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#4fd1c5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#8bb8d6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#f6a96b"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 4px; fill: #55d6c9; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: 1px; fill: #f2f6f7; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #9bb0bf; }
      .section-num { font-size: 15px; font-weight: 800; letter-spacing: 2px; fill: #55d6c9; }
      .section-title { font-size: 25px; font-weight: 750; fill: #f2f6f7; }
      .section-meta { font-size: 14px; fill: #89a2b4; }
      .card-title { font-size: 17px; font-weight: 700; fill: #edf4f5; }
      .card-text { font-size: 14px; fill: #a9bdc9; }
      .small { font-size: 12px; fill: #8da7b7; }
      .api { font-size: 13px; fill: #c8d8df; }
      .provider { font-size: 16px; font-weight: 700; fill: #edf4f5; }
      .panel { stroke: #28485b; stroke-width: 1.5; }
      .card { fill: #102a3d; stroke: #294b5f; stroke-width: 1.2; }
      .muted-card { fill: #0c2436; stroke: #244456; stroke-width: 1.2; }
      .chip { fill: #15394a; stroke: #2d5668; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="50" r="300" fill="#16445b" opacity="0.17"/>
  <circle cx="90" cy="1060" r="270" fill="#0b5961" opacity="0.10"/>

  <!-- Masthead -->
  <g class="sans">
    <text x="70" y="62" class="eyebrow">SYSTEM BLUEPRINT · 2026</text>
    <text x="70" y="126" class="title">Menu System｜系統架構</text>
    <text x="70" y="163" class="subtitle">Config-driven Web Menu · iframe isolation · Unified AI provider gateway</text>
    <line x1="70" y1="192" x2="1850" y2="192" stroke="#315064" stroke-width="1"/>
    <text x="1850" y="128" text-anchor="end" class="section-num">ARCHITECTURE / 01</text>
    <text x="1850" y="158" text-anchor="end" class="section-meta">FRONTEND · PROXY · PROVIDERS</text>
  </g>

  <!-- Browser boundary -->
  <g filter="url(#shadow)" class="sans">
    <rect x="70" y="230" width="920" height="690" rx="22" fill="url(#browserPanel)" class="panel"/>
    <text x="100" y="272" class="section-num">01 / CLIENT</text>
    <text x="100" y="306" class="section-title">使用者瀏覽器</text>
    <text x="960" y="304" text-anchor="end" class="section-meta">HTML5 · CSS3 · Vanilla JavaScript</text>

    <!-- Config -->
    <rect x="100" y="335" width="245" height="215" rx="15" class="muted-card"/>
    <rect x="118" y="353" width="62" height="25" rx="12" fill="#1c4d58"/>
    <text x="149" y="371" text-anchor="middle" class="small" fill="#71ded2">CONFIG</text>
    <text x="118" y="410" class="card-title">設定驅動層</text>
    <text x="118" y="442" class="card-text">Menu Config</text>
    <text x="118" y="468" class="card-text">Header / Footer Config</text>
    <text x="118" y="494" class="card-text">Provider Types</text>
    <text x="118" y="527" class="small">透過 script 載入，支援 file://</text>

    <!-- Main frame -->
    <rect x="375" y="335" width="585" height="360" rx="15" class="card"/>
    <text x="397" y="370" class="card-title">主框架</text>
    <text x="938" y="370" text-anchor="end" class="small mono">index.html · app.js</text>
    <rect x="397" y="392" width="541" height="47" rx="9" fill="#16384b" stroke="#31576a"/>
    <text x="418" y="422" class="card-title">Header</text>
    <text x="912" y="422" text-anchor="end" class="small">搜尋 · 主題 · 語言 · 使用者</text>
    <rect x="397" y="454" width="145" height="174" rx="10" fill="#0c2435" stroke="#31576a"/>
    <text x="416" y="486" class="card-title">Menu</text>
    <text x="416" y="514" class="small">二階層導航</text>
    <text x="416" y="539" class="small">三態收合</text>
    <text x="416" y="564" class="small">Badge 更新</text>
    <rect x="559" y="454" width="379" height="174" rx="10" fill="#0b2030" stroke="#55b9b1" stroke-width="1.4"/>
    <text x="580" y="486" class="card-title">Content iframe</text>
    <text x="916" y="486" text-anchor="end" class="small">隔離式頁面容器</text>
    <rect x="580" y="505" width="337" height="42" rx="7" class="chip"/>
    <text x="596" y="531" class="card-text">Provider Management</text>
    <rect x="580" y="557" width="337" height="42" rx="7" class="chip"/>
    <text x="596" y="583" class="card-text">Model Browser · 內部 / 外部頁面</text>
    <rect x="397" y="642" width="541" height="35" rx="8" fill="#16384b" stroke="#31576a"/>
    <text x="418" y="665" class="card-text">Footer</text>
    <text x="912" y="665" text-anchor="end" class="small">版本 · 版權 · 系統狀態</text>

    <!-- Supporting services -->
    <rect x="100" y="724" width="860" height="166" rx="15" class="muted-card"/>
    <text x="120" y="758" class="card-title">共用服務與瀏覽器儲存</text>
    <g>
      <rect x="120" y="778" width="145" height="54" rx="9" class="chip"/>
      <text x="192" y="801" text-anchor="middle" class="card-title">i18n</text>
      <text x="192" y="820" text-anchor="middle" class="small">zh-TW / en</text>
      <rect x="280" y="778" width="145" height="54" rx="9" class="chip"/>
      <text x="352" y="801" text-anchor="middle" class="card-title">Theme</text>
      <text x="352" y="820" text-anchor="middle" class="small">Light / Dark</text>
      <rect x="440" y="778" width="145" height="54" rx="9" class="chip"/>
      <text x="512" y="801" text-anchor="middle" class="card-title">Messenger</text>
      <text x="512" y="820" text-anchor="middle" class="small">postMessage</text>
      <rect x="600" y="778" width="170" height="54" rx="9" class="chip"/>
      <text x="685" y="801" text-anchor="middle" class="card-title">Provider Manager</text>
      <text x="685" y="820" text-anchor="middle" class="small">CRUD · API Client</text>
      <rect x="785" y="778" width="155" height="54" rx="9" fill="#203b44" stroke="#856341"/>
      <text x="862" y="801" text-anchor="middle" class="card-title">localStorage</text>
      <text x="862" y="820" text-anchor="middle" class="small">設定 · 狀態</text>
    </g>
    <text x="120" y="862" class="small">瀏覽器內部：主題、語言、Menu 狀態與 AI Provider 設定皆保留在本機</text>
  </g>

  <!-- Proxy boundary -->
  <g filter="url(#shadow)" class="sans">
    <rect x="1080" y="230" width="385" height="690" rx="22" fill="#0e293c" class="panel"/>
    <text x="1110" y="272" class="section-num">02 / GATEWAY</text>
    <text x="1110" y="306" class="section-title">AI Proxy</text>
    <text x="1435" y="304" text-anchor="end" class="section-meta mono">:3001</text>
    <rect x="1110" y="335" width="325" height="92" rx="14" class="card"/>
    <circle cx="1140" cy="365" r="9" fill="#55d6c9"/>
    <text x="1162" y="371" class="card-title">Node.js + Express</text>
    <text x="1130" y="401" class="card-text">CORS · Request forwarding · Normalization</text>

    <text x="1110" y="467" class="section-num">API SURFACE</text>
    <rect x="1110" y="486" width="325" height="52" rx="9" class="muted-card"/>
    <text x="1128" y="518" class="api mono">GET  /api/health</text>
    <rect x="1110" y="550" width="325" height="52" rx="9" class="muted-card"/>
    <text x="1128" y="582" class="api mono">GET  /providers/:type/models</text>
    <rect x="1110" y="614" width="325" height="52" rx="9" class="muted-card"/>
    <text x="1128" y="646" class="api mono">POST /providers/:type/test</text>
    <rect x="1110" y="678" width="325" height="52" rx="9" class="muted-card"/>
    <text x="1128" y="710" class="api mono">POST /providers/:type/chat</text>

    <rect x="1110" y="765" width="325" height="95" rx="13" fill="#302d29" stroke="#936d47"/>
    <text x="1130" y="797" class="card-title" fill="#ffd1a8">Ollama Streaming</text>
    <text x="1130" y="824" class="card-text">Server-Sent Events · token-by-token</text>
    <text x="1130" y="846" class="small">其他供應商使用標準 JSON 回應</text>
  </g>

  <!-- Providers boundary -->
  <g filter="url(#shadow)" class="sans">
    <rect x="1555" y="230" width="295" height="690" rx="22" fill="#0d2739" class="panel"/>
    <text x="1585" y="272" class="section-num">03 / SERVICES</text>
    <text x="1585" y="306" class="section-title">AI Providers</text>
    <g>
      <rect x="1585" y="346" width="235" height="70" rx="13" class="card"/>
      <circle cx="1614" cy="381" r="11" fill="#55d6c9"/><text x="1640" y="387" class="provider">OpenAI</text>
      <rect x="1585" y="431" width="235" height="70" rx="13" class="card"/>
      <circle cx="1614" cy="466" r="11" fill="#76afd0"/><text x="1640" y="472" class="provider">Google Gemini</text>
      <rect x="1585" y="516" width="235" height="70" rx="13" fill="#302d29" stroke="#936d47"/>
      <circle cx="1614" cy="551" r="11" fill="#f6a96b"/><text x="1640" y="557" class="provider">Ollama</text>
      <text x="1798" y="557" text-anchor="end" class="small" fill="#f6a96b">SSE</text>
      <rect x="1585" y="601" width="235" height="70" rx="13" class="card"/>
      <circle cx="1614" cy="636" r="11" fill="#9bc5d9"/><text x="1640" y="642" class="provider">LM Studio</text>
      <rect x="1585" y="686" width="235" height="70" rx="13" class="card"/>
      <circle cx="1614" cy="721" r="11" fill="#d7b584"/><text x="1640" y="727" class="provider">Anthropic Claude</text>
      <rect x="1585" y="771" width="235" height="70" rx="13" class="card"/>
      <circle cx="1614" cy="806" r="11" fill="#7fb7a7"/><text x="1640" y="800" class="provider">OpenAI-Compatible</text>
      <text x="1640" y="821" class="small">Local / Cloud API</text>
    </g>
    <text x="1585" y="876" class="small">模型查詢 · 連線測試 · 聊天補全</text>
  </g>

  <!-- Main data flows -->
  <g fill="none" stroke-linecap="round">
    <path d="M990 515 C1023 515 1043 515 1070 515" stroke="#4fd1c5" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M1070 554 C1042 554 1020 554 994 554" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrowTeal)" opacity="0.75"/>
    <path d="M1465 515 C1498 515 1518 515 1545 515" stroke="#8bb8d6" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1545 554 C1518 554 1498 554 1469 554" stroke="#8bb8d6" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.75"/>
    <path d="M1585 551 C1535 551 1510 610 1467 610" stroke="#f6a96b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>
    <path d="M345 435 C360 435 361 435 372 435" stroke="#6f96aa" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M512 772 C512 734 620 710 620 632" stroke="#77b8bd" stroke-width="2" stroke-dasharray="7 7"/>
  </g>
  <g class="sans">
    <rect x="995" y="454" width="70" height="30" rx="15" fill="#153a47" stroke="#39716f"/>
    <text x="1030" y="474" text-anchor="middle" class="small" fill="#67ded1">HTTP</text>
    <rect x="1470" y="454" width="70" height="30" rx="15" fill="#18374a" stroke="#41657a"/>
    <text x="1505" y="474" text-anchor="middle" class="small" fill="#9dc5da">API</text>
    <rect x="520" y="687" width="112" height="28" rx="14" fill="#163847" stroke="#3d6678"/>
    <text x="576" y="706" text-anchor="middle" class="small">postMessage</text>
  </g>

  <!-- Legend/footer -->
  <g class="sans">
    <line x1="70" y1="958" x2="1850" y2="958" stroke="#315064" stroke-width="1"/>
    <text x="70" y="995" class="section-num">DATA FLOW</text>
    <line x1="210" y1="989" x2="268" y2="989" stroke="#4fd1c5" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <text x="282" y="995" class="card-text">HTTP REST</text>
    <line x1="405" y1="989" x2="463" y2="989" stroke="#8bb8d6" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="477" y="995" class="card-text">Provider API</text>
    <line x1="630" y1="989" x2="688" y2="989" stroke="#77b8bd" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="702" y="995" class="card-text">postMessage</text>
    <line x1="855" y1="989" x2="913" y2="989" stroke="#f6a96b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>
    <text x="927" y="995" class="card-text">Ollama SSE</text>
    <text x="1850" y="995" text-anchor="end" class="section-meta">Config-driven · Zero build tools · Local-first settings</text>
    <text x="70" y="1042" class="small">MENU SYSTEM / TECHNICAL ARCHITECTURE</text>
    <text x="1850" y="1042" text-anchor="end" class="small">SVG SOURCE · 1920 × 1080</text>
  </g>
</svg>
